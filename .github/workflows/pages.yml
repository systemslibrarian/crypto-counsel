name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # timeout-minutes on every job: GitHub's default is 360, so a hung step burns
  # six hours of runner time and nothing goes red until it finally times out.
  # These ceilings are sized off this repo's own measured runs (2026-08/09):
  # validate 8-11s, deploy 12-13s, auto-merge 10s plus up to two 15s merge
  # retries. Each is a wide multiple of that -- generous enough that a slow
  # runner or a Pages API wait never trips it, tight enough that a hang is
  # caught in minutes rather than hours. Queue time does not count against it.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # crypto-compare is the only oracle for two facts the corpus states in
      # prose: how many unique crypto-lab demos its algorithm reference links,
      # and which ?cat= slugs it actually defines. validate.mjs used to derive
      # both only `if (existsSync(...))` and fall back to a pinned constant --
      # which meant that in CI, the one place it runs unattended, neither check
      # ran at all and a drift to 193 passed green. It is a hard failure now
      # when the checkout is absent, so CI has to supply it. Public repo, so
      # the default GITHUB_TOKEN is enough; it is read-only reference data and
      # lands OUTSIDE the deploy job, which takes its own clean checkout, so
      # nothing here reaches the published artifact.
      - name: Check out crypto-compare (cross-repo oracle)
        uses: actions/checkout@v7
        with:
          repository: systemslibrarian/crypto-compare
          ref: main
          path: vendor/crypto-compare
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate repo (corpus, model, slug consistency)
        run: node scripts/validate.mjs

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. Depends on every gate job in this workflow, so a bump can
  # only merge itself once this lab's whole PR gate went green. Majors are
  # excluded -- the 2026-08-18 batch had to hold back 109 bumps and they were
  # overwhelmingly majors (@noble v2 dropped export subpaths, TypeScript 7,
  # vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: validate
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- unit tests, build, axe WCAG and the e2e
      # claims -- judges a bump far better than its version number does. A major
      # that actually breaks this lab fails the gate and stays open for a human.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run pages.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
